<!doctype html>
<html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Previsão ECMWF Brasil</title>
<style>:root{--azul:#0b5cab;--azul2:#072f5f;--texto:#172033;--card:#fff;--borda:#dbe3ee}*{box-sizing:border-box}body{margin:0;font-family:Segoe UI,Arial,sans-serif;background:linear-gradient(135deg,#e9f3ff,#f7f9fc);color:var(--texto)}header{background:linear-gradient(120deg,var(--azul2),var(--azul));color:#fff;padding:38px 20px}.wrap{max-width:1180px;margin:auto}h1{margin:0 0 8px;font-size:32px}header p{margin:0;opacity:.9}.busca{background:#fff;margin:-22px auto 24px;padding:18px;border-radius:14px;box-shadow:0 8px 30px #0b315329;position:relative}input{width:100%;padding:14px 16px;border:1px solid var(--borda);border-radius:9px;font-size:16px;outline:none}input:focus{border-color:var(--azul)}#sugestoes{position:absolute;left:18px;right:18px;top:70px;background:#fff;border:1px solid var(--borda);border-radius:9px;box-shadow:0 10px 24px #0002;z-index:10;max-height:320px;overflow:auto}.sug{padding:12px 14px;cursor:pointer;border-bottom:1px solid #eef2f7}.sug:hover{background:#edf6ff}.oculto{display:none!important}.status{text-align:center;padding:28px;color:#526174}.cabecalho{display:flex;justify-content:space-between;align-items:end;margin:18px 0}.cabecalho h2{margin:0}.modelo{font-size:13px;color:#637083}.grade{display:grid;grid-template-columns:repeat(auto-fit,minmax(210px,1fr));gap:14px;padding-bottom:35px}.card{background:var(--card);border:1px solid var(--borda);border-radius:14px;padding:16px;box-shadow:0 4px 16px #102a4310}.data{font-weight:700;color:var(--azul2)}.temp{font-size:27px;font-weight:700;margin-top:10px}.min{font-size:16px;color:#657387}.dados{border-top:1px solid #eef2f7;margin-top:13px;padding-top:11px;font-size:13px;line-height:1.8}.erro{background:#fff0f0;color:#a40000;padding:14px;border-radius:9px}@media(max-width:600px){h1{font-size:25px}.cabecalho{display:block}.grade{grid-template-columns:1fr 1fr}.card{padding:12px}}@media(max-width:420px){.grade{grid-template-columns:1fr}}</style></head>
<body><header><div class="wrap"><h1>Previsão do tempo</h1><p>15 dias para todos os municípios brasileiros</p></div></header><main class="wrap"><section class="busca"><input id="pesquisa" autocomplete="off" placeholder="Digite a cidade ou UF, exemplo: Belo Horizonte"><div id="sugestoes" class="oculto"></div></section><div id="status" class="status">Pesquise uma cidade para consultar a previsão.</div><section id="resultado" class="oculto"><div class="cabecalho"><div><h2 id="titulo"></h2><div id="coords" class="modelo"></div></div><div class="modelo">ECMWF IFS 0.25°</div></div><div id="grade" class="grade"></div></section></main>
<script>
const input=document.getElementById('pesquisa'),sugestoes=document.getElementById('sugestoes'),statusEl=document.getElementById('status'),resultado=document.getElementById('resultado'),grade=document.getElementById('grade');let timer;
input.addEventListener('input',()=>{clearTimeout(timer);const q=input.value.trim();if(q.length<2){sugestoes.classList.add('oculto');return}timer=setTimeout(async()=>{const r=await fetch('/api/cidades?q='+encodeURIComponent(q));const cs=await r.json();sugestoes.innerHTML=cs.length?cs.map(c=>`<div class="sug" data-id="${c.id}" data-label="${c.nome} - ${c.uf}"><strong>${c.nome}</strong> - ${c.uf}<br><small>${c.estado}</small></div>`).join(''):'<div class="sug">Nenhuma cidade encontrada</div>';sugestoes.classList.remove('oculto')},250)});
sugestoes.addEventListener('click',e=>{const item=e.target.closest('[data-id]');if(!item)return;input.value=item.dataset.label;sugestoes.classList.add('oculto');carregar(item.dataset.id)});document.addEventListener('click',e=>{if(!e.target.closest('.busca'))sugestoes.classList.add('oculto')});
function dataBR(s){return new Date(s+'T12:00:00').toLocaleDateString('pt-BR',{weekday:'short',day:'2-digit',month:'2-digit'})}
async function carregar(codigo){resultado.classList.add('oculto');statusEl.textContent='Consultando previsão...';statusEl.classList.remove('oculto');try{const r=await fetch('/api/previsao?codigo='+encodeURIComponent(codigo));const d=await r.json();if(!r.ok)throw new Error(d.erro||'Erro na consulta');document.getElementById('titulo').textContent=`${d.cidade} - ${d.uf}`;document.getElementById('coords').textContent=`Latitude ${d.latitude.toFixed(4)} | Longitude ${d.longitude.toFixed(4)}`;grade.innerHTML=d.previsoes.map(p=>`<article class="card"><div class="data">${dataBR(p.data)}</div><div class="temp">${Math.round(p.temp_max)}° <span class="min">/ ${Math.round(p.temp_min)}°</span></div><div class="dados">💧 Chuva: <b>${p.chuva_mm} mm</b> (${p.chance_chuva??0}%)<br>🌬️ Vento: <b>${p.vento_max} km/h</b><br>💨 Rajada: ${p.rajada_max} km/h</div></article>`).join('');statusEl.classList.add('oculto');resultado.classList.remove('oculto')}catch(e){statusEl.innerHTML=`<div class="erro">${e.message}</div>`}}
</script></body></html>
